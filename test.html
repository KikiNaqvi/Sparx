<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChurroAI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#ececec;
    overflow:hidden;
}

/* Raining logos */
.rain{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}
.drop{
    position:absolute;
    width:60px;
    animation:fall linear infinite;
    opacity:.7;
}
@keyframes fall{
    from{transform:translateY(-100px) rotate(0deg);}
    to{transform:translateY(110vh) rotate(360deg);}
}

/* Floating logos */
.pop{
    position:fixed;
    width:80px;
    animation:pop 4s infinite ease-in-out;
    z-index:1;
}
@keyframes pop{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.25) rotate(15deg);}
}

.banner{
    position:fixed;
    left:0;
    right:0;
    background:#ffde59;
    color:#000;
    text-align:center;
    font-weight:bold;
    padding:8px;
    z-index:5;
    box-shadow:0 3px 5px rgba(0,0,0,.2);
}

.top{top:0;}
.bottom{bottom:0;}

.chat{
    position:relative;
    z-index:10;
    width:420px;
    margin:90px auto;
    background:white;
    border:3px solid #000;
    padding:15px;
    box-shadow:8px 8px #999;
}

.logo{
    display:block;
    margin:auto;
    width:120px;
}

h1{
    text-align:center;
    margin:5px;
}

#messages{
    height:250px;
    overflow-y:auto;
    border:2px solid #000;
    background:#fafafa;
    padding:10px;
    margin-bottom:10px;
}

input{
    width:75%;
    padding:8px;
}

button{
    padding:8px 15px;
    cursor:pointer;
}

.msg{
    margin:6px 0;
}

.bot{
    color:green;
}

.user{
    color:blue;
}
</style>
</head>
<body>

<div class="banner top">🍩 CHURROAI OFFICIAL 🍩</div>
<div class="banner bottom">Made with real churros!</div>

<div class="rain" id="rain"></div>

<img class="pop" src="https://i.ibb.co/CKSMWCDS/IMG-0506-removebg-preview.png" style="left:5%;top:20%;">
<img class="pop" src="https://i.ibb.co/CKSMWCDS/IMG-0506-removebg-preview.png" style="right:5%;top:65%;animation-delay:1s;">
<img class="pop" src="https://i.ibb.co/CKSMWCDS/IMG-0506-removebg-preview.png" style="left:80%;top:15%;animation-delay:2s;">

<div class="chat">
    <img class="logo" src="https://i.ibb.co/CKSMWCDS/IMG-0506-removebg-preview.png">
    <h1>ChurroAI</h1>

    <div id="messages"></div>

    <input id="input" placeholder="Talk to ChurroAI...">
    <button onclick="send()">Send</button>
</div>

<script>
const replies = [
    "I dont fucking care.",
    "Fuck you.",
    "Hell. O",
    "mazz parcanda khadijah",
    "hehehe",
    "fuck off.",
    "ummmmmmm",
    "uhmm",
    "I bored",
    "do it now"
];

function send(){
    const input=document.getElementById("input");
    if(!input.value.trim()) return;

    const messages=document.getElementById("messages");

    messages.innerHTML+=`<div class="msg user"><b>You:</b> ${input.value}</div>`;

    const reply=replies[Math.floor(Math.random()*replies.length)];

    setTimeout(()=>{
        messages.innerHTML+=`<div class="msg bot"><b>ChurroAI:</b> ${reply}</div>`;
        messages.scrollTop=messages.scrollHeight;
    },400);

    input.value="";
}

// Raining logos
const rain=document.getElementById("rain");

for(let i=0;i<35;i++){
    const img=document.createElement("img");
    img.src="https://i.ibb.co/CKSMWCDS/IMG-0506-removebg-preview.png";
    img.className="drop";
    img.style.left=Math.random()*100+"vw";
    img.style.animationDuration=(3+Math.random()*6)+"s";
    img.style.animationDelay=(-Math.random()*6)+"s";
    img.style.width=(30+Math.random()*40)+"px";
    rain.appendChild(img);
}

document.getElementById("input").addEventListener("keydown",e=>{
    if(e.key==="Enter") send();
});
</script>

</body>
</html>
